<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portico Q4 LinkedIn ad review</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1f2521;background:#f6f4ef}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #0a66c2;outline-offset:3px}.wrap{width:min(100% - 32px,760px);margin:auto}header{padding:32px 0 18px;border-bottom:1px solid #dcded9}h1{font-size:28px;line-height:1.2;margin:0 0 8px}header p{margin:0;color:#56605a;line-height:1.5}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0 10px;flex-wrap:wrap}.tabs{display:flex;gap:4px;border-bottom:1px solid #cbd1cc}.tab{border:0;background:transparent;padding:10px 16px;color:#52605a;font-weight:700;border-bottom:3px solid transparent}.tab[aria-selected=true]{color:#1d2520;border-color:#d96750}.all{background:#fff;border:1px solid #bbc4be;border-radius:20px;padding:8px 14px;color:#26352c}.count{font-size:13px;color:#637068;margin:0 0 22px}.ad{margin:0 0 42px}.ad-label{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:14px;font-weight:700}.ad-label em{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8d4b37}.ad-label small{color:#53755b;font-weight:700}.post{background:#fff;border:1px solid #d7dadd;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #17211a0c;font-family:Arial,Helvetica,sans-serif}.identity{display:flex;gap:10px;align-items:center;padding:14px 16px 8px}.avatar{width:48px;height:48px;border:1px solid #e6e6e6;border-radius:4px;object-fit:contain;background:white}.identity strong{font-size:15px}.identity small{display:block;color:#626b72;font-size:12px;margin-top:3px}.dots{margin-left:auto;align-self:flex-start;color:#666;font-size:20px;line-height:1}.body{padding:4px 16px 12px;font-size:14px;line-height:1.48;white-space:pre-line}.copy{display:inline}.toggle{border:0;background:transparent;color:#5f666b;font-weight:700;padding:0;margin-left:4px}.creative{display:block;width:100%;height:auto}.destination{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 16px;background:#f3f5f5}.destination strong{font-size:15px;line-height:1.3}.cta{border:1px solid #0a66c2;color:#0a66c2;border-radius:18px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}.engagement{display:flex;justify-content:space-around;gap:4px;border-top:1px solid #e8ebed;padding:5px 8px}.engagement button{border:0;background:none;color:#626b72;padding:10px 4px;font-size:13px;font-weight:700}.engagement span{font-size:17px;vertical-align:-1px;margin-right:5px}@media(max-width:480px){h1{font-size:24px}.destination strong{font-size:13px}.engagement button{font-size:11px}.engagement span{display:block;font-size:16px}}
</style></head><body><header><div class="wrap"><h1>Portico LinkedIn ad review</h1><p>Q4 campaign mockups. Review the first lines with copy collapsed, then expand each post to read the full draft.</p></div></header><main class="wrap"><div class="toolbar"><div class="tabs" role="tablist" aria-label="Ad group"><button class="tab" role="tab" data-lane="Financial Aid" aria-selected="true">Financial Aid</button><button class="tab" role="tab" data-lane="Attendance" aria-selected="false">Attendance</button></div><button class="all" id="all" type="button">Expand all</button></div><p class="count" id="count"></p><div id="ads"></div></main>
<script>
const ads=[{"lane": "Financial Aid", "number": "1", "headline": "Get financial aid to students faster with less manual work", "body": "What if your financial aid team could cut processing time from days to hours?\n\nPortico automates ISIR imports, verification, packaging, and disbursement, reducing manual work and helping your team get financial aid to students faster while maintaining compliance.", "image": "assets/Portico_FA_Q326_Ad1.png", "approved": false}, {"lane": "Financial Aid", "number": "2", "headline": "Feel confident in every financial aid file you process", "body": "Get the extra financial aid support your team needs to stay compliant.\n\nPortico's managed financial aid services help career schools keep up with file reviews, reduce processing time, and minimize compliance risk. Whether you're short-staffed or need additional support during busy periods, Portico helps your team keep financial aid moving and students on track.", "image": "assets/Portico_FA_Q326_Ad2.png", "approved": true}, {"lane": "Financial Aid", "number": "3", "headline": "Take the manual work out of financial aid administration", "body": "Manual financial aid processes slow your team down and increase compliance risk.\n\nPortico automates financial aid workflows, reduces repetitive data entry, and makes it easier to manage each student's financial aid. Built for clock hour, credit hour, term-based, and hybrid programs.", "image": "assets/Portico_FA_Q326_Ad3.png", "approved": false}, {"lane": "Financial Aid", "number": "4", "headline": "Help more students without adding compliance risk", "body": "Serving more students shouldn't make it harder to stay compliant.\n\nPortico offers financial aid software and managed services to help career schools process aid faster, reduce manual work, and maintain compliance while improving student outcomes.", "image": "assets/Portico_FA_Q326_Ad4.png", "approved": false}, {"lane": "Financial Aid", "number": "5", "headline": "Run financial aid in a way that works for your school", "body": "Need better financial aid software, more hands on deck, or both?\n\nPortico gives career schools the flexibility to manage financial aid in-house, outsource it to experienced financial aid professionals, or supplement their existing team with managed services.", "image": "assets/Portico_FA_Q326_Ad5.png", "approved": false}, {"lane": "Financial Aid", "number": "6", "headline": "Stay ahead of changing financial aid regulations", "body": "Keeping up with federal financial aid regulations is a job in itself.\n\nPortico builds regulatory changes directly into its financial aid software, so your team has fewer manual updates to manage. Get the software and expert support you need to stay compliant as requirements change.", "image": "assets/Portico_FA_Q326_Ad6.png", "approved": false}, {"lane": "Attendance", "number": "1", "headline": "Reduce compliance risk with automated attendance tracking", "body": "Incomplete attendance records are a compliance risk.\n\nPortico replaces paper sign-in sheets and manual tracking with verified, timestamped attendance records. Automatically capture first and last dates of attendance, maintain a complete audit trail, and pull the records you need in minutes.", "image": "assets/Portico_Attendance_Q426_Ad1.png", "approved": false}, {"lane": "Attendance", "number": "2", "headline": "Know which students need support before they fall too far behind", "body": "The sooner you know a student is falling behind, the sooner you can help.\n\nPortico gives instructors and administrators real-time visibility into student attendance and hours completed, making it easier to identify students who need additional support and help them stay on track toward graduation.", "image": "assets/Portico_Attendance_Q426_Ad2.png", "approved": false}, {"lane": "Attendance", "number": "3", "headline": "Give students more ownership over their attendance and progress", "body": "Make it easier for students to track their attendance and hours.\n\nWith Portico's mobile app, students can check in, track their hours, and see their progress in real time. Give students more visibility into their own progress to encourage accountability and keep them engaged throughout their program.", "image": "assets/Portico_Attendance_Q426_Ad3.png", "approved": false}, {"lane": "Attendance", "number": "4", "headline": "Know exactly when and where your students are checking in", "body": "Know your students are where they're supposed to be when they check in.\n\nPortico uses multiple attendance verification methods, including GPS, QR codes, and sound, to verify student attendance. Instructors and administrators get accurate, timestamped records without having to manually track student hours.", "image": "assets/Portico_Attendance_Q426_Ad4.png", "approved": false}, {"lane": "Attendance", "number": "5", "headline": "Automate attendance tracking wherever your students learn", "body": "Tracking attendance across classrooms, externships, and online learning shouldn't mean more work for your team.\n\nPortico automates attendance tracking across all learning environments, closes gaps in externship records, and helps career schools maintain accurate, audit-ready attendance records.", "image": "assets/Portico_Attendance_Q426_Ad5.png", "approved": false}, {"lane": "Attendance", "number": "5 Alt", "headline": "Keep accurate attendance records across every learning environment", "body": "Keep track of student attendance in the classroom, at externships, and online.\n\nPortico brings attendance records from every learning environment into one place. Students can easily log their hours through the mobile app, while instructors and administrators can access accurate attendance data in real time.", "image": "assets/Portico_Attendance_Q426_Ad5_alt.png", "approved": false}];
let lane='Financial Aid';const expanded=new Set();const limit=145;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function excerpt(s){if(s.length<=limit)return s;let cut=s.lastIndexOf(' ',limit);return s.slice(0,cut>70?cut:limit).trimEnd()+'…'}
function render(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.lane===lane)));const visible=ads.filter(a=>a.lane===lane);document.querySelector('#count').textContent=`${visible.length} ads in numbered order`;document.querySelector('#all').textContent=visible.every(a=>expanded.has(a.lane+a.number))?'Collapse all':'Expand all';document.querySelector('#ads').innerHTML=visible.map(a=>{const key=a.lane+a.number;const open=expanded.has(key);return `<section class="ad"><div class="ad-label"><em>Ad ${esc(a.number)}</em>${a.approved?'<small>Approved copy</small>':''}</div><article class="post"><div class="identity"><img class="avatar" src="assets/portico-social-icon.png" alt="Portico logo"><div><strong>Portico</strong><small>Promoted</small></div><span class="dots" aria-hidden="true">•••</span></div><div class="body"><span class="copy">${esc(open?a.body:excerpt(a.body))}</span>${a.body.length>limit?`<button class="toggle" type="button" data-key="${esc(key)}" aria-expanded="${open}">${open?'see less':'see more'}</button>`:''}</div><img class="creative" src="${esc(a.image)}" alt="Original ${esc(a.lane)} ad ${esc(a.number)} creative"><div class="destination"><strong>${esc(a.headline)}</strong><span class="cta">Learn more</span></div><div class="engagement" aria-label="LinkedIn engagement preview"><button type="button"><span>♡</span>Like</button><button type="button"><span>▤</span>Comment</button><button type="button"><span>↗</span>Repost</button><button type="button"><span>➤</span>Send</button></div></article></section>`}).join('');document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{expanded.has(b.dataset.key)?expanded.delete(b.dataset.key):expanded.add(b.dataset.key);render()})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{lane=b.dataset.lane;render()});document.querySelector('#all').onclick=()=>{let items=ads.filter(a=>a.lane===lane);let all=items.every(a=>expanded.has(a.lane+a.number));items.forEach(a=>all?expanded.delete(a.lane+a.number):expanded.add(a.lane+a.number));render()};render();
</script></body></html>
